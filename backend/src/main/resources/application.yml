server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: cloudmind-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

cloudmind:
  security:
    allowed-origins: ${CLOUDMIND_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  minio:
    bucket: ${MINIO_BUCKET:cloudmind}
  bootstrap-admin:
    username: ${CLOUDMIND_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${CLOUDMIND_BOOTSTRAP_ADMIN_PASSWORD:}
  demo:
    default-quota-bytes: ${DEFAULT_QUOTA_BYTES:10737418240}
  ai:
    api-key: ${CLOUDMIND_AI_API_KEY:}
    require-environment-key: false
    config-encryption-key: ${CLOUDMIND_AI_CONFIG_ENCRYPTION_KEY:}
    allowed-hosts: ${CLOUDMIND_AI_ALLOWED_HOSTS:api.deepseek.com,api.openai.com}
  auth:
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
    cleanup-interval-ms: ${TOKEN_CLEANUP_INTERVAL_MS:3600000}
    max-login-failures: ${MAX_LOGIN_FAILURES:5}
    login-lock-duration: ${LOGIN_LOCK_DURATION:PT15M}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:5}
    register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:3}
    refresh-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:30}
    password-change-per-15-minutes: ${RATE_LIMIT_PASSWORD_CHANGE_PER_15_MINUTES:5}
    upload-per-minute: ${RATE_LIMIT_UPLOAD_PER_MINUTE:30}
    ai-per-minute: ${RATE_LIMIT_AI_PER_MINUTE:30}
  upload:
    max-file-bytes: ${MAX_FILE_BYTES:104857600}
