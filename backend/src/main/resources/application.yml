server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: cloudmind-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

cloudmind:
  minio:
    bucket: ${MINIO_BUCKET:cloudmind}
  bootstrap-admin:
    username: ${CLOUDMIND_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${CLOUDMIND_BOOTSTRAP_ADMIN_PASSWORD:}
  demo:
    default-quota-bytes: ${DEFAULT_QUOTA_BYTES:10737418240}
  ai:
    api-key: ${CLOUDMIND_AI_API_KEY:}
    require-environment-key: false
