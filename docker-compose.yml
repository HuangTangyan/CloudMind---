services:
  mysql:
    image: mysql:8.0.46
    container_name: cloudmind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cloudmind}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_BIND_PORT:-3306}:3306"
    networks:
      - cloudmind-data
    volumes:
      - cloudmind_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE must be a reviewed, immutable MinIO-compatible image tag}
    container_name: cloudmind-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-cloudmind}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MINIO_API_BIND_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_BIND_PORT:-9001}:9001"
    networks:
      - cloudmind-data
    volumes:
      - cloudmind_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  cloudmind_mysql_data:
  cloudmind_minio_data:

networks:
  cloudmind-data:
    internal: true
